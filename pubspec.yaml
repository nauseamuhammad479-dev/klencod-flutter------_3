class ChatPage extends StatefulWidget {
  const ChatPage({super.key});

  @override
  State<ChatPage> createState() => _ChatPageState();
}

class _ChatPageState extends State<ChatPage> {
  final controller = TextEditingController();
  final scrollController = ScrollController();
  final webSearch = NovaWebSearch();

  final List<Map<String, String>> messages = [
    {
      'role': 'ai',
      'text':
          'أهلًا بيك في NOVA AI!\n'
          'تقدر تضيف معلوماتك وتدربني من تبويب "التدريب التفاعلي"، '
          'وأنا أبحث في الذاكرة والإنترنت للإجابة.',
    },
  ];

  bool busy = false;
  bool useInternet = true;

  Future<String> answer(String question) async {
    final results =
        await NovaDatabase.instance.search(question);

    final output = <String>[];

    if (results.isNotEmpty) {
      output.add('📚 معلومات من ذاكرتي:\n');

      for (final item in results) {
        output.add(
          '• ${item['title']}\n${item['content']}',
        );
      }
    }

    if (useInternet) {
      try {
        final web = await webSearch.search(question);

        if (web.isNotEmpty) {
          output.add('\n🌐 نتائج البحث على الإنترنت:\n');

          for (final result in web) {
            output.add(
              '• ${result.title}\n'
              '${result.snippet}\n'
              'المصدر: ${result.url}',
            );
          }
        }
      } catch (_) {
        output.add(
          '\nتعذر الاتصال بالإنترنت. '
          'يمكنك المحاولة مرة أخرى.',
        );
      }
    }

    if (output.isEmpty) {
      return 'لم أجد معلومات كافية للإجابة عن سؤالك.\n'
          'توجه إلى غرفة التدريب التفاعلي وعلمني إياها أو حاول البحث مجددًا.';
    }

    output.add(
      '\nتنبيه: النسخة الحالية تسترجع المعلومات '
      'وتبحث على الإنترنت، ولم يتم توصيل نموذج لغوي '
      'محلي بها بعد.',
    );

    return output.join('\n\n');
  }

  Future<void> send() async {
    final question = controller.text.trim();

    if (question.isEmpty || busy) return;

    controller.clear();

    setState(() {
      messages.add({
        'role': 'user',
        'text': question,
      });
      busy = true;
    });

    try {
      final response = await answer(question);

      if (!mounted) return;

      setState(() {
        messages.add({
          'role': 'ai',
          'text': response,
        });
      });
    } catch (error) {
      if (!mounted) return;

      setState(() {
        messages.add({
          'role': 'ai',
          'text': 'حدث خطأ: $error',
        });
      });
    } finally {
      if (mounted) setState(() => busy = false);
    }
  }

  @override
  void dispose() {
    controller.dispose();
    scrollController.dispose();
    super.dispose();
  }

  @override
  Widget build(BuildContext context) {
    return Column(
      children: [
        SwitchListTile(
          value: useInternet,
          activeColor: gold,
          title: const Text('البحث على الإنترنت'),
          subtitle: const Text('البحث عبر ويكيبيديا العربية'),
          onChanged: (value) {
            setState(() => useInternet = value);
          },
        ),
        Expanded(
          child: ListView.builder(
            controller: scrollController,
            padding: const EdgeInsets.all(12),
            itemCount: messages.length + (busy ? 1 : 0),
            itemBuilder: (context, index) {
              if (busy && index == messages.length) {
                return const Padding(
                  padding: EdgeInsets.all(16),
                  child: Align(
                    alignment: Alignment.centerRight,
                    child: CircularProgressIndicator(
                      color: gold,
                    ),
                  ),
                );
              }

              final message = messages[index];
              final isUser = message['role'] == 'user';

              return Align(
                alignment: isUser
                    ? Alignment.centerRight
                    : Alignment.centerLeft,
                child: Container(
                  width: double.infinity,
                  margin: const EdgeInsets.symmetric(vertical: 5),
                  padding: const EdgeInsets.all(14),
                  decoration: BoxDecoration(
                    color: isUser
                        ? const Color(0xFF292D36)
                        : panel,
                    borderRadius: BorderRadius.circular(15),
                    border: Border.all(
                      color: isUser
                          ? Colors.white12
                          : gold.withOpacity(0.25),
                    ),
                  ),
                  child: SelectableText(
                    message['text'] ?? '',
                    style: const TextStyle(height: 1.6),
                  ),
                ),
              );
            },
          ),
        ),
        SafeArea(
          top: false,
          child: Padding(
            padding: const EdgeInsets.all(10),
            child: Row(
              children: [
                Expanded(
                  child: TextField(
                    controller: controller,
                    minLines: 1,
                    maxLines: 4,
                    onSubmitted: (_) => send(),
                    decoration: const InputDecoration(
                      hintText: 'اسأل NOVA AI...',
                    ),
                  ),
                ),
                const SizedBox(width: 8),
                IconButton.filled(
                  onPressed: busy ? null : send,
                  style: IconButton.styleFrom(
                    backgroundColor: gold,
                    foregroundColor: Colors.black,
                  ),
                  icon: const Icon(Icons.send),
                ),
              ],
            ),
          ),
        ),
      ],
    );
  }
}

// ==================== TRAINING ROOM (Interactive Chat) ====================

class TrainingPage extends StatefulWidget {
  const TrainingPage({super.key});

  @override
  State<TrainingPage> createState() => _TrainingPageState();
}

class _TrainingPageState extends State<TrainingPage> {
  final controller = TextEditingController();
  final scrollController = ScrollController();
  
  final List<Map<String, String>> trainingMessages = [
    {
      'role': 'ai',
      'text': 'أهلاً بك في غرفة التدريب التفاعلية! 🧠\n'
          'تحدث معي الآن وعلمني أي معلومة، قاعدة، أو توجيه تريده. '
          'كل ما تكتبه هنا سيتم حفظه تلقائياً في ذاكرتي لأستطيع تذكره والإجابة بناءً عليه في قسم المحادثة.',
    },
  ];
  
  bool busy = false;

  Future<void> sendTraining() async {
    final text = controller.text.trim();
    if (text.isEmpty || busy) return;

    controller.clear();

    setState(() {
      trainingMessages.add({
        'role': 'user',
        'text': text,
      });
      busy = true;
    });

    try {
      // استخراج عنوان قصير من النص المحفوظ
      final title = text.length > 30 ? '${text.substring(0, 30)}...' : text;
      
      // حفظ التدريب تلقائياً في قاعدة البيانات
      await NovaDatabase.instance.addKnowledge(
        title,
        text,
        source: 'محادثة التدريب التفاعلي',
      );

      if (!mounted) return;

      setState(() {
        trainingMessages.add({
          'role': 'ai',
          'text': '✅ رائع! لقد استوعبت المعلومة وحفظتها في الذاكرة بنجاح.\n'
              'هل لديك معلومة أخرى تريد تعليمي إياها؟',
        });
      });
    } catch (error) {
      if (!mounted) return;

      setState(() {
        trainingMessages.add({
          'role': 'ai',
          'text': '⚠️ حدث خطأ أثناء الحفظ: $error',
        });
      });
    } finally {
      if (mounted) {
        setState(() => busy = false);
        // التمرير التلقائي لأسفل المحادثة
        Future.delayed(const Duration(milliseconds: 100), () {
          if (scrollController.hasClients) {
            scrollController.animateTo(
              scrollController.position.maxScrollExtent,
              duration: const Duration(milliseconds: 300),
              curve: Curves.easeOut,
            );
          }
        });
      }
    }
  }

  Future<void> importFile() async {
    final result = await FilePicker.platform.pickFiles(
      type: FileType.custom,
      allowedExtensions: ['txt', 'md'],
      withData: true,
    );

    if (result == null || result.files.isEmpty) return;

    final file = result.files.single;
    final bytes = file.bytes;

    if (bytes == null) {
      ScaffoldMessenger.of(context).showSnackBar(
        const SnackBar(content: Text('تعذر قراءة الملف')),
      );
      return;
    }

    final content = utf8.decode(bytes, allowMalformed: true);

    await NovaDatabase.instance.addKnowledge(
      file.name,
      content,
      source: 'ملف: ${file.name}',
    );

    setState(() {
      trainingMessages.add({
        'role': 'ai',
        'text': '📂 تم استيراد الملف "${file.name}" وحفظ محتواه في الذاكرة بنجاح!',
      });
    });
  }

  @override
  void dispose() {
    controller.dispose();
    scrollController.dispose();
    super.dispose();
  }

  @override
  Widget build(BuildContext context) {
    return Column(
      children: [
        Container(
          padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 10),
          color: panel,
          child: Row(
            children: [
              const Icon(Icons.psychology_alt, color: gold),
              const SizedBox(width: 8),
              const Expanded(
                child: Text(
                  'التدريب المباشر (تحدث وعلمني)',
                  style: TextStyle(fontWeight: FontWeight.bold),
                ),
              ),
              IconButton(
                icon: const Icon(Icons.upload_file, color: gold),
                tooltip: 'استيراد ملف TXT أو MD',
                onPressed: importFile,
              ),
            ],
          ),
        ),
        Expanded(
          child: ListView.builder(
            controller: scrollController,
            padding: const EdgeInsets.all(12),
            itemCount: trainingMessages.length + (busy ? 1 : 0),
            itemBuilder: (context, index) {
              if (busy && index == trainingMessages.length) {
                return const Padding(
                  padding: EdgeInsets.all(16),
                  child: Align(
                    alignment: Alignment.centerLeft,
                    child: CircularProgressIndicator(
                      color: gold,
                    ),
                  ),
                );
              }

              if (index >= trainingMessages.length) return const SizedBox.shrink();

              final message = trainingMessages[index];
              final isUser = message['role'] == 'user';

              return Align(
                alignment: isUser
                    ? Alignment.centerRight
                    : Alignment.centerLeft,
                child: Container(
                  width: double.infinity,
                  margin: const EdgeInsets.symmetric(vertical: 5),
                  padding: const EdgeInsets.all(14),
                  decoration: BoxDecoration(
                    color: isUser
                        ? const Color(0xFF292D36)
                        : panel,
                    borderRadius: BorderRadius.circular(15),
                    border: Border.all(
                      color: isUser
                          ? Colors.white12
                          : gold.withOpacity(0.25),
                    ),
                  ),
                  child: SelectableText(
                    message['text'] ?? '',
                    style: const TextStyle(height: 1.6),
                  ),
                ),
              );
            },
          ),
        ),
        SafeArea(
          top: false,
          child: Padding(
            padding: const EdgeInsets.all(10),
            child: Row(
              children: [
                Expanded(
                  child: TextField(
                    controller: controller,
                    minLines: 1,
                    maxLines: 4,
                    onSubmitted: (_) => sendTraining(),
                    decoration: const InputDecoration(
                      hintText: 'اكتب معلومة لتدريب NOVA AI...',
                    ),
                  ),
                ),
                const SizedBox(width: 8),
                IconButton.filled(
                  onPressed: busy ? null : sendTraining,
                  style: IconButton.styleFrom(
                    backgroundColor: gold,
                    foregroundColor: Colors.black,
                  ),
                  icon: const Icon(Icons.send),
                ),
              ],
            ),
          ),
        ),
      ],
    );
  }
}

