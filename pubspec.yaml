// ==================== DATABASE ====================

class NovaDatabase {
  NovaDatabase._();

  static final instance = NovaDatabase._();
  Database? _database;

  Future<void> init() async {
    final dbPath = await getDatabasesPath();

    _database = await openDatabase(
      path.join(dbPath, 'nova_ai.db'),
      version: 1,
      onCreate: (db, version) async {
        await db.execute('''
          CREATE TABLE knowledge (
            id INTEGER PRIMARY KEY AUTOINCREMENT,
            title TEXT NOT NULL,
            content TEXT NOT NULL,
            source TEXT NOT NULL,
            created_at TEXT NOT NULL
          )
        ''');
      },
    );
  }

  Database get db {
    if (_database == null) {
      throw StateError('قاعدة البيانات لم تبدأ بعد');
    }
    return _database!;
  }

  Future<void> addKnowledge(
    String title,
    String content, {
    String source = 'تدريب تفاعلي',
  }) async {
    if (content.trim().isEmpty) return;

    await db.insert('knowledge', {
      'title': title.trim().isEmpty ? 'معلومة جديدة' : title.trim(),
      'content': content.trim(),
      'source': source,
      'created_at': DateTime.now().toIso8601String(),
    });
  }

  Future<List<Map<String, Object?>>> getAll() {
    return db.query('knowledge', orderBy: 'id DESC');
  }

  Future<List<Map<String, Object?>>> search(String query) async {
    final all = await getAll();

    final terms = query
        .toLowerCase()
        .replaceAll(RegExp(r'[^\p{L}\p{N}\s]', unicode: true), ' ')
        .split(RegExp(r'\s+'))
        .where((word) => word.length > 1)
        .toSet();

    if (terms.isEmpty) return [];

    final scored = <({Map<String, Object?> item, int score})>[];

    for (final item in all) {
      final text =
          '${item['title']} ${item['content']}'.toLowerCase();

      int score = 0;

      for (final term in terms) {
        if (text.contains(term)) score++;
      }

      if (score > 0) {
        scored.add((item: item, score: score));
      }
    }

    scored.sort((a, b) => b.score.compareTo(a.score));

    return scored.take(5).map((e) => e.item).toList();
  }

  Future<void> deleteKnowledge(int id) async {
    await db.delete(
      'knowledge',
      where: 'id = ?',
      whereArgs: [id],
    );
  }
}

// ==================== INTERNET SEARCH ====================

class WebResult {
  final String title;
  final String snippet;
  final String url;

  const WebResult({
    required this.title,
    required this.snippet,
    required this.url,
  });
}

class NovaWebSearch {
  Future<List<WebResult>> search(String question) async {
    final uri = Uri.https(
      'ar.wikipedia.org',
      '/w/api.php',
      {
        'action': 'query',
        'list': 'search',
        'srsearch': question,
        'format': 'json',
        'utf8': '1',
        'srlimit': '5',
      },
    );

    final response = await http
        .get(uri, headers: {
          'User-Agent': 'NOVA-AI/1.0',
        })
        .timeout(const Duration(seconds: 15));

    if (response.statusCode != 200) {
      throw Exception('البحث غير متاح حاليًا');
    }

    final json = jsonDecode(response.body)
        as Map<String, dynamic>;

    final query = json['query'] as Map<String, dynamic>?;
    final rows = query?['search'] as List<dynamic>? ?? [];

    return rows.map((row) {
      final item = row as Map<String, dynamic>;
      final title = item['title'] as String? ?? 'بدون عنوان';

      final snippet = (item['snippet'] as String? ?? '')
          .replaceAll(RegExp(r'<[^>]*>'), '')
          .replaceAll('&quot;', '"')
          .replaceAll('&amp;', '&')
          .replaceAll('&#039;', "'");

      return WebResult(
        title: title,
        snippet: snippet,
        url:
            'https://ar.wikipedia.org/wiki/${Uri.encodeComponent(title.replaceAll(' ', '_'))}',
      );
    }).toList();
  }
}

